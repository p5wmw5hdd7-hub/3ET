<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>注文確認ボード</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#e9edf1; --ink:#1a2330; --sub:#5b6776; --card:#ffffff; --line:#c9d1da;
    --yellow:#ffd23f; --yellow-ink:#3a2e00;
    --green:#27b068; --green-ink:#ffffff;
    --accent:#2455d6;
  }
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%}
  body{
    background:var(--bg); color:var(--ink);
    font-family:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic","Meiryo",sans-serif;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    -webkit-tap-highlight-color:transparent;
  }
  header{
    position:sticky; top:0; z-index:5; background:var(--ink); color:#fff;
    padding:10px 16px; display:flex; flex-wrap:wrap; align-items:center; gap:10px 18px;
  }
  header h1{margin:0; font-size:18px; font-weight:900; letter-spacing:.02em}
  .conn{display:flex; align-items:center; gap:6px; font-size:13px; color:#cdd6e2}
  .dot{width:10px; height:10px; border-radius:50%; background:#e0554b}
  .dot.on{background:#3ddc84}
  .totals{display:flex; gap:6px; margin-left:auto; flex-wrap:wrap}
  .tot{background:#2b3747; border-radius:8px; padding:4px 10px; font-weight:900; font-size:16px; min-width:58px; text-align:center}
  .tot small{font-weight:500; font-size:12px; color:#9fb0c4; margin-right:4px}
  .tot.zero{opacity:.45}
  .tools{display:flex; gap:8px}
  .tools button{background:transparent; border:1px solid #55657a; color:#dfe7f1; border-radius:8px; padding:5px 10px; font:inherit; font-size:13px}

  main{padding:14px}
  .grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(210px,1fr)); gap:12px}
  .empty{padding:60px 10px; text-align:center; color:var(--sub); font-size:18px; line-height:1.8}

  .card{
    position:relative; border:3px solid var(--line); border-radius:16px; background:var(--card);
    padding:12px 14px 14px; cursor:pointer; user-select:none; text-align:left; font:inherit; color:inherit; width:100%;
    transition:background .15s, border-color .15s, transform .08s, opacity .35s;
  }
  .card:active{transform:scale(.98)}
  .card:focus-visible{outline:4px solid var(--accent); outline-offset:2px}
  .card .no{font-size:56px; line-height:1; font-weight:900; font-variant-numeric:tabular-nums}
  .card .st{position:absolute; right:12px; top:14px; font-size:13px; font-weight:700; color:var(--sub)}
  .chips{display:flex; flex-wrap:wrap; gap:6px; margin-top:10px}
  .chip{background:#eef1f4; border-radius:10px; padding:4px 10px; font-size:22px; font-weight:900; font-variant-numeric:tabular-nums}
  .chip b{font-weight:900; margin-right:2px}
  .chip i{font-style:normal; font-size:15px; font-weight:700; margin-left:1px; color:var(--sub)}
  .noitem{margin-top:10px; font-size:14px; color:var(--sub)}

  .card.s1{background:var(--yellow); border-color:#d9a900; color:var(--yellow-ink)}
  .card.s1 .st{color:var(--yellow-ink)}
  .card.s1 .chip{background:rgba(255,255,255,.55)}
  .card.s1 .chip i{color:var(--yellow-ink)}
  .card.s2{background:var(--green); border-color:#168a4e; color:var(--green-ink)}
  .card.s2 .st{color:#eafff3}
  .card.s2 .chip{background:rgba(255,255,255,.22)}
  .card.s2 .chip i{color:#eafff3}
  .card.out{opacity:0; transform:scale(.94)}
  .undo{
    position:absolute; right:10px; bottom:10px; background:rgba(0,0,0,.14); color:inherit; border:0;
    border-radius:8px; padding:5px 9px; font:inherit; font-size:13px; font-weight:700;
  }

  .panel{position:fixed; inset:auto 0 0 0; max-height:62vh; background:#fff; border-top:3px solid var(--ink); z-index:10; display:none; flex-direction:column}
  .panel.open{display:flex}
  .panel .bar{display:flex; gap:8px; align-items:center; padding:10px 14px; border-bottom:1px solid var(--line)}
  .panel .bar strong{margin-right:auto}
  .panel button{border:1px solid var(--line); background:#f6f8fa; border-radius:8px; padding:6px 10px; font:inherit; font-size:13px}
  .log{overflow:auto; padding:8px 14px 16px; font-size:12px}
  .log div{padding:6px 0; border-bottom:1px dashed var(--line); word-break:break-all}
  .log em{font-style:normal; font-weight:700; color:var(--accent); margin-right:6px}
  .log em.bad{color:#c0392b}
  .log code{font-family:ui-monospace,Menlo,Consolas,monospace; color:#334}
  @media (prefers-reduced-motion:reduce){ .card{transition:none} }
</style>
</head>
<body>
<header>
  <h1>注文確認ボード</h1>
  <div class="conn"><span class="dot" id="dot"></span><span id="connText">接続中…</span></div>
  <div class="totals" id="totals"></div>
  <div class="tools"><button id="logBtn" type="button">受信ログ</button></div>
</header>

<main>
  <div class="grid" id="grid"></div>
  <div class="empty" id="empty">待機中の注文はありません。<br>メイン画面で待機登録すると、ここに表示されます。</div>
</main>

<section class="panel" id="panel" aria-label="受信ログ">
  <div class="bar">
    <strong>受信ログ（新しい順）</strong>
    <button id="copyLog" type="button">コピー</button>
    <button id="clearAll" type="button">注文を全消去</button>
    <button id="closeLog" type="button">閉じる</button>
  </div>
  <div class="log" id="log"></div>
</section>

<script>
(function(){
  "use strict";

  // メイン画面（3ER）・サブ1・サブ2 と同じ ntfy.sh のトピック
  var TOPIC = "numcall-66abfc3b63208f53";
  var STORE = "orderboard-v1";
  var LETTERS = ["A","B","C","D","E"];

  /* ---------- 状態 ---------- */
  var orders = [];          // {no, items:{A:2}, status:0|1|2, t:number}
  var itemCache = {};       // 番号ごとの最後に見た注文内容
  var rawLog = [];          // {time, text, result}

  try{
    var saved = JSON.parse(localStorage.getItem(STORE) || "null");
    if(saved && Array.isArray(saved.orders)){ orders = saved.orders; itemCache = saved.itemCache || {}; }
  }catch(e){}

  function persist(){
    try{ localStorage.setItem(STORE, JSON.stringify({orders:orders, itemCache:itemCache})); }catch(e){}
  }

  /* ---------- 解析 ---------- */
  var NUMKEYS = ["number","no","num","n","ticket","code","callNumber","id"];
  var ITEMKEYS = ["items","order","orders","menu","selection","selected","cart","counts","products","lines","qty"];
  var QTYKEYS = ["qty","count","quantity","n","num","amount"];
  var NAMEKEYS = ["name","label","key","item","menu","id"];

  function isScalar(v){ return typeof v === "number" || typeof v === "string"; }

  function pickNum(o){
    if(isScalar(o)) return String(o);
    if(o && typeof o === "object" && !Array.isArray(o)){
      for(var i=0;i<NUMKEYS.length;i++){
        var v = o[NUMKEYS[i]];
        if(v !== undefined && v !== null && isScalar(v)) return String(v);
      }
    }
    return null;
  }

  function findItems(o){
    if(!o || typeof o !== "object" || Array.isArray(o)) return null;
    for(var i=0;i<ITEMKEYS.length;i++){
      if(o[ITEMKEYS[i]] !== undefined && o[ITEMKEYS[i]] !== null) return o[ITEMKEYS[i]];
    }
    return null;
  }

  function firstDefined(o, keys){
    for(var i=0;i<keys.length;i++){ if(o[keys[i]] !== undefined && o[keys[i]] !== null) return o[keys[i]]; }
    return undefined;
  }

  function addItem(map, name, q){
    q = Number(q);
    if(!name || !isFinite(q) || q <= 0) return;
    name = String(name);
    map[name] = (map[name] || 0) + q;
  }

  function normItems(x){
    var map = {};
    if(x === null || x === undefined) return map;
    if(Array.isArray(x)){
      x.forEach(function(el){
        if(isScalar(el)){ addItem(map, el, 1); return; }
        if(el && typeof el === "object"){
          var name = firstDefined(el, NAMEKEYS);
          if(name !== undefined && typeof name !== "object"){
            var q = firstDefined(el, QTYKEYS);
            addItem(map, name, q === undefined ? 1 : q);
          }else{
            var sub = normItems(el);
            Object.keys(sub).forEach(function(k){ addItem(map, k, sub[k]); });
          }
        }
      });
      return map;
    }
    if(typeof x === "object"){
      Object.keys(x).forEach(function(k){
        var v = x[k];
        if(isScalar(v)) addItem(map, k, v);
        else if(v && typeof v === "object"){
          var q = firstDefined(v, QTYKEYS);
          var nm = firstDefined(v, ["name","label"]);
          addItem(map, nm || k, q === undefined ? 1 : q);
        }
      });
    }
    return map;
  }

  function entryOf(e){
    var no = pickNum(e);
    if(!no) return null;
    return {no:no, items:normItems(findItems(e))};
  }

  function typeOf(o){
    var t = firstDefined(o, ["type","action","event","kind","cmd","op","t"]);
    return typeof t === "string" ? t.toLowerCase() : "";
  }

  // 1メッセージから「待機一覧」「呼出」「追加」「削除」を取り出す
  function analyze(o, out, depth){
    if(!o || typeof o !== "object" || depth > 4) return;
    if(Array.isArray(o)){ o.forEach(function(x){ analyze(x, out, depth+1); }); return; }

    Object.keys(o).forEach(function(k){
      var v = o[k];
      if(Array.isArray(v) && /wait|queue|pending|待/i.test(k)){
        out.waiting = v.map(entryOf).filter(Boolean);
      }else if(/^(current|called|now|calling|display)$/i.test(k) && v !== null && v !== undefined){
        var c = entryOf(v);
        if(c) out.called.push(c);
      }else if(v && typeof v === "object" && !Array.isArray(v) && !/history|log|done/i.test(k)){
        analyze(v, out, depth+1);
      }
    });

    var t = typeOf(o);
    var e = entryOf(o);
    if(t && e){
      if(/remove|cancel|delete|del|drop/.test(t)) out.removed.push(e);
      else if(/call|recall|show/.test(t)) out.called.push(e);
      else if(/wait|add|queue|reg|order|enqueue|pending/.test(t)) out.added.push(e);
    }
  }

  function findOrder(no){
    for(var i=0;i<orders.length;i++){ if(orders[i].no === no) return orders[i]; }
    return null;
  }

  function upsert(e){
    if(Object.keys(e.items).length) itemCache[e.no] = e.items;
    var o = findOrder(e.no);
    var items = Object.keys(e.items).length ? e.items : (itemCache[e.no] || {});
    if(o){ o.items = items; }
    else{ orders.push({no:e.no, items:items, status:0, t:Date.now()}); }
  }

  function removeNo(no){
    var i = orders.findIndex(function(o){ return o.no === no; });
    if(i >= 0){ orders.splice(i,1); return true; }
    return false;
  }

  function handle(msgText){
    var obj = null, result = "解析不可";
    try{ obj = JSON.parse(msgText); }catch(e){}
    // JSONが文字列の中に入っている場合
    if(typeof obj === "string"){ try{ obj = JSON.parse(obj); }catch(e){} }
    if(!obj || typeof obj !== "object"){ return result; }

    // 3ER（メイン画面）が送る numcall-display-v1 形式: wait=待機番号, orders={番号:{A:個数…}}, cur=呼出中
    if(obj.kind === "numcall-display-v1" && Array.isArray(obj.wait)){
      var ords = obj.orders || {};
      var order = {};
      obj.wait.forEach(function(n, idx){
        n = String(n);
        order[n] = idx;
        var items = normItems(ords[n]);
        itemCache[n] = items;
        var ex = findOrder(n);
        if(ex){ ex.items = items; }
        else{ orders.push({no:n, items:items, status:0, t:Date.now()}); }
      });
      var cnt = orders.length;
      // 待機一覧にない番号（呼出済み・取消）は消す
      orders = orders.filter(function(o){ return order[o.no] !== undefined; });
      orders.sort(function(a, b){ return order[a.no] - order[b.no]; });
      return "待機 " + obj.wait.length + "件" + (obj.cur ? " / 呼出中 " + obj.cur : "") + (cnt !== orders.length ? " / 消去 " + (cnt - orders.length) : "");
    }

    var out = {waiting:null, called:[], added:[], removed:[]};
    analyze(obj, out, 0);

    var notes = [];
    // 呼出された注文内容は先に覚えておく
    out.called.forEach(function(c){ if(Object.keys(c.items).length) itemCache[c.no] = c.items; });

    if(out.waiting){
      var keep = {};
      out.waiting.forEach(function(e){ keep[e.no] = true; upsert(e); });
      var before = orders.length;
      orders = orders.filter(function(o){ return keep[o.no]; });
      notes.push("待機 " + out.waiting.length + "件");
      if(before !== orders.length) notes.push("消去 " + (before - orders.length));
    }
    out.added.forEach(function(e){ upsert(e); notes.push("追加 " + e.no); });
    out.called.forEach(function(c){ if(removeNo(c.no)) notes.push("呼出 " + c.no); });
    out.removed.forEach(function(r){ if(removeNo(r.no)) notes.push("取消 " + r.no); });

    return notes.length ? notes.join(" / ") : "対象外";
  }

  /* ---------- 画面 ---------- */
  var grid = document.getElementById("grid");
  var emptyEl = document.getElementById("empty");
  var totalsEl = document.getElementById("totals");
  var STNAME = ["未確認","確認中","確認済み"];

  function sortKeys(keys){
    return keys.slice().sort(function(a,b){
      var ia = LETTERS.indexOf(a), ib = LETTERS.indexOf(b);
      if(ia >= 0 && ib >= 0) return ia - ib;
      if(ia >= 0) return -1;
      if(ib >= 0) return 1;
      return a.localeCompare(b, "ja");
    });
  }

  function renderTotals(){
    var sum = {};
    orders.forEach(function(o){ Object.keys(o.items).forEach(function(k){ sum[k] = (sum[k]||0) + o.items[k]; }); });
    var keys = LETTERS.slice();
    Object.keys(sum).forEach(function(k){ if(keys.indexOf(k) < 0) keys.push(k); });
    totalsEl.textContent = "";
    sortKeys(keys).forEach(function(k){
      var d = document.createElement("div");
      d.className = "tot" + (sum[k] ? "" : " zero");
      var s = document.createElement("small"); s.textContent = k;
      d.appendChild(s);
      d.appendChild(document.createTextNode(String(sum[k] || 0)));
      totalsEl.appendChild(d);
    });
  }

  function render(){
    grid.textContent = "";
    emptyEl.style.display = orders.length ? "none" : "block";
    orders.forEach(function(o){
      var card = document.createElement("div");
      card.className = "card s" + o.status;
      card.setAttribute("role","button");
      card.tabIndex = 0;
      card.dataset.no = o.no;
      card.setAttribute("aria-label", "番号 " + o.no + " " + STNAME[o.status]);

      var no = document.createElement("div"); no.className = "no"; no.textContent = o.no;
      var st = document.createElement("div"); st.className = "st"; st.textContent = STNAME[o.status];
      card.appendChild(no); card.appendChild(st);

      var keys = sortKeys(Object.keys(o.items));
      if(keys.length){
        var chips = document.createElement("div"); chips.className = "chips";
        keys.forEach(function(k){
          var c = document.createElement("span"); c.className = "chip";
          var b = document.createElement("b"); b.textContent = k;
          var q = document.createElement("span"); q.textContent = String(o.items[k]);
          var i = document.createElement("i"); i.textContent = "個";
          c.appendChild(b); c.appendChild(q); c.appendChild(i);
          chips.appendChild(c);
        });
        card.appendChild(chips);
      }else{
        var n = document.createElement("div"); n.className = "noitem"; n.textContent = "注文内容なし";
        card.appendChild(n);
      }

      if(o.status > 0){
        var u = document.createElement("button");
        u.type = "button"; u.className = "undo"; u.textContent = "戻す";
        u.addEventListener("click", function(ev){
          ev.stopPropagation();
          o.status = Math.max(0, o.status - 1);
          persist(); render();
        });
        card.appendChild(u);
      }

      function tap(){
        if(o.status < 2){ o.status++; persist(); render(); }
      }
      card.addEventListener("click", tap);
      card.addEventListener("keydown", function(ev){
        if(ev.key === "Enter" || ev.key === " "){ ev.preventDefault(); tap(); }
      });
      grid.appendChild(card);
    });
    renderTotals();
  }

  /* ---------- 受信ログ ---------- */
  var panel = document.getElementById("panel");
  var logEl = document.getElementById("log");

  function renderLog(){
    logEl.textContent = "";
    rawLog.forEach(function(r){
      var d = document.createElement("div");
      var em = document.createElement("em");
      em.textContent = r.time + " " + r.result;
      if(r.result === "解析不可" || r.result === "対象外") em.className = "bad";
      var code = document.createElement("code");
      code.textContent = r.text;
      d.appendChild(em); d.appendChild(code);
      logEl.appendChild(d);
    });
  }

  document.getElementById("logBtn").addEventListener("click", function(){ renderLog(); panel.classList.toggle("open"); });
  document.getElementById("closeLog").addEventListener("click", function(){ panel.classList.remove("open"); });
  document.getElementById("copyLog").addEventListener("click", function(){
    var txt = rawLog.map(function(r){ return r.time + "\t" + r.result + "\t" + r.text; }).join("\n");
    if(navigator.clipboard) navigator.clipboard.writeText(txt).catch(function(){});
  });
  document.getElementById("clearAll").addEventListener("click", function(){
    if(confirm("表示中の注文をすべて消します。よろしいですか？")){
      orders = []; persist(); render();
    }
  });

  /* ---------- ntfy.sh 接続 ---------- */
  var dot = document.getElementById("dot");
  var connText = document.getElementById("connText");
  var seen = {};
  var es = null;

  function onMessage(ev){
    var m;
    try{ m = JSON.parse(ev.data); }catch(e){ return; }
    if(m.event && m.event !== "message") return;
    if(m.id){ if(seen[m.id]) return; seen[m.id] = true; }
    var text = typeof m.message === "string" ? m.message : "";
    var result = handle(text);
    var d = new Date((m.time ? m.time * 1000 : Date.now()));
    rawLog.unshift({
      time: ("0"+d.getHours()).slice(-2) + ":" + ("0"+d.getMinutes()).slice(-2) + ":" + ("0"+d.getSeconds()).slice(-2),
      text: text.length > 600 ? text.slice(0,600) + "…" : text,
      result: result
    });
    if(rawLog.length > 40) rawLog.length = 40;
    persist(); render();
    if(panel.classList.contains("open")) renderLog();
  }

  function connect(){
    if(es){ try{ es.close(); }catch(e){} }
    es = new EventSource("https://ntfy.sh/" + TOPIC + "/sse?since=12h");
    es.onopen = function(){ dot.classList.add("on"); connText.textContent = "接続中（ntfy.sh）"; };
    es.onmessage = onMessage;
    es.onerror = function(){
      dot.classList.remove("on");
      connText.textContent = "再接続中…";
    };
  }

  render();
  connect();
  document.addEventListener("visibilitychange", function(){
    if(!document.hidden && (!es || es.readyState === 2)) connect();
  });
})();
</script>
</body>
</html>
